 <div class="logo"><i>💻</i><div>IT Live<small>Noutbuk nazorati · NP 01–NP 42</small></div></div>
 <nav id="nav">

<script>
const K='itlive_nb_v1';
const GR={room:'Xonada (umumiy)',t1:'',t2:'',emp:'Hodimlar'};
const CONDS=['A’lo','Yaxshi','Qoniqarli','Ta’mir kerak','Buzilgan'];
let S,tab='home',flt='all',q='',repDate=today();
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function nowT(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function init(){
 const L=[];for(let i=1;i<=42;i++){const g=i===19?'emp':i<=23?'room':i<=33?'t1':i<=37?'t2':'emp';
  L.push({id:'NP '+String(i).padStart(2,'0'),model:'',cond:'Yaxshi',group:g,holder:'',note:''})}
 return{laptops:L,loans:[],reports:[],names:{t1:'1-o‘qituvchi',t2:'2-o‘qituvchi'},resp:''}}
function load(){try{const r=localStorage.getItem(K);S=r?JSON.parse(r):init()}catch(e){S=init()}
 try{S.laptops.forEach(x=>{if(!MODELS.includes(x.model))x.model=''});S.loans=S.loans||[];S.reports=S.reports||[];S.persons=S.persons||[];if(!S.v2){const n=S.laptops.find(x=>x.id==='NP 19');if(n&&n.group==='room')n.group='emp';S.v2=1;save()}S.names=S.names||{t1:'1-o‘qituvchi',t2:'2-o‘qituvchi'}}catch(e){S=init()}}
let lastC={},DB=null,canW=true,me='',pushT,applying=false;
function track(){S.hist=S.hist||[];S.laptops.forEach(x=>{const c=lastC[x.id];if(c){if(c.c!==x.cond)S.hist.push({id:x.id,d:today(),t:nowT(),ev:'Holat: '+c.c+' → '+x.cond,by:me});if(c.h!==x.holder)S.hist.push({id:x.id,d:today(),t:nowT(),ev:x.holder?'Biriktirildi: '+x.holder:'Hodimdan qaytarildi',by:me})}lastC[x.id]={c:x.cond,h:x.holder}});if(S.hist.length>600)S.hist=S.hist.slice(-600);if(S.loans.length>1500)S.loans=S.loans.slice(-1500)}
function save(){track();S.ts=Date.now();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}push()}
function push(){if(!DB||!canW||applying)return;clearTimeout(pushT);pushT=setTimeout(()=>{try{DB.doc('state/main').set({json:JSON.stringify(S),ts:S.ts}).catch(()=>{})}catch(e){}},600)}
async function initCloud(){try{if(typeof claude==='undefined')return;const d=await claude.use('db');if(!d)return;DB=d;const u=await claude.use('user');if(u){try{canW=(await u.can('data.write'))!==false}catch(e){}try{me=(await u.me()).name||''}catch(e){}}
 document.body.classList.toggle('ro',!canW);document.getElementById('cl').textContent=canW?'☁ Umumiy baza':'👁 Faqat ko‘rish';
 DB.doc('state/main').onSnapshot(s=>{const v=s.exists&&s.data();cloudRes();if(!v){push();return}if(v.ts>(S.ts||0)){try{applying=true;S=JSON.parse(v.json);S.hist=S.hist||[];S.repairs=S.repairs||[];S.loans=S.loans||[];S.reports=S.reports||[];lastC={};track();try{localStorage.setItem(K,v.json)}catch(e){}render()}catch(e){}applying=false}else if(v.ts<(S.ts||0))push()},()=>{})}catch(e){}}
const inRepair=id=>(S.repairs||[]).some(r=>r.id===id&&!r.back);
async function dlRaw(name,data){try{const d=await claude.use('downloads');if(!d){toast('Yuklab olish mavjud emas');return}await d.save({filename:name,data})}catch(e){}}

nav{position:fixed;left:0;right:0;bottom:0;margin:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:#0b0b0f;border-top:2px solid #d9152b;z-index:30;gap:2px;overflow-x:auto}
nav button{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;padding:6px 10px;min-width:66px}nav button:before{font-size:20px;line-height:1.1}
main{padding-bottom:100px}.g4{grid-template-columns:repeat(2,1fr)}.stat b{font-size:26px}h2{font-size:19px}.hero{padding:18px}.hero h1{font-size:20px}
.toast{bottom:96px}dialog{width:94vw;padding:18px}.rg{grid-template-columns:repeat(auto-fill,minmax(135px,1fr))}.row input,.row select{min-width:0;flex:1 1 140px}table{min-width:560px}.out{padding:6px 9px}}
</style>
<script>
let ver=0,pT=null,pollT=null,scanMode='out';window.curUser='admin';
const api=(p,o)=>fetch(p,Object.assign({credentials:'same-origin',headers:{'Content-Type':'application/json'}},o||{}));
function adopt(j){if(j.state)S=j.state;ver=j.ver;S.hist=S.hist||[];S.repairs=S.repairs||[];S.loans=S.loans||[];S.reports=S.reports||[];S.persons=S.persons||[];S.names=S.names||{t1:'1-o‘qituvchi',t2:'2-o‘qituvchi'};S.laptops.forEach(x=>{if(!MODELS.includes(x.model))x.model=''});lastC={};track()}
async function startSync(user){window.curUser=user;me=user;canW=true;document.getElementById('cl').textContent='🟢 Server';document.getElementById('gh').textContent='';
 const r=await api('/api/state');if(r.status===401)return false;const j=await r.json();if(j.state)adopt(j);else{ver=j.ver;await flush()}
 document.body.classList.remove('lock');render();clearInterval(pollT);pollT=setInterval(poll,4000);return true}
async function poll(){try{const r=await api('/api/state?v='+ver);if(r.status===401){document.body.classList.add('lock');return}const j=await r.json();if(j.same||pT)return;adopt(j);const a=document.activeElement,t=a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)&&document.getElementById('app').contains(a);if(!t&&!document.getElementById('dlg').open)render()}catch(e){}}
function save(){track();push()}
function push(){clearTimeout(pT);pT=setTimeout(flush,350)}
async function flush(){clearTimeout(pT);pT=null;try{const r=await api('/api/state',{method:'PUT',body:JSON.stringify({state:S,base:ver})});if(r.status===409){adopt(await r.json());render();toast('⚠ Boshqa foydalanuvchi o‘zgartirgan edi. Yangilandi, amalni qayta bajaring');return}if(r.status===401){document.body.classList.add('lock');return}ver=(await r.json()).ver}catch(e){toast('⚠ Server bilan aloqa yo‘q')}}
async function initCloud(){}
async function doLogin(){try{const r=await api('/api/login',{method:'POST',body:JSON.stringify({u:gu.value.trim(),p:gp.value})}),j=await r.json().catch(()=>({}));
 if(r.ok){gp.value='';ge.textContent='';await startSync(j.user);hashGo()}else{ge.textContent=j.error||'Xato';const g=document.getElementById('gbox');g.classList.remove('shake');void g.offsetWidth;g.classList.add('shake')}}catch(e){ge.textContent='Server bilan aloqa yo‘q'}}
async function logout(){try{await api('/api/logout',{method:'POST'})}catch(e){}clearInterval(pollT);gp.value='';document.body.classList.add('lock')}
async function saveAuth(){if(a2.value&&a2.value!==a3.value){toast('⚠ Yangi parollar bir xil emas');return}
 const r=await api('/api/password',{method:'POST',body:JSON.stringify({old:a0.value,user:a1.value.trim(),pass:a2.value})}),j=await r.json().catch(()=>({}));
 if(!r.ok){toast('⚠ '+(j.error||'Xato'));return}window.curUser=a1.value.trim();a0.value=a2.value=a3.value='';toast('✔ Login va parol yangilandi')}
function dlRaw(name,data){try{const b=data instanceof Blob?data:new Blob([data]),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}catch(e){toast('⚠ Yuklab bo‘lmadi')}}
function qr(){const b=location.origin+location.pathname,R=S.laptops.filter(x=>+x.id.slice(3)<=23);return`<h2>QR yorliqlar (NP 01–NP 23) <button class="btn ghost sm keep" onclick="window.print()">🖨 Chop etish</button> <button class="btn sm keep" onclick="scanOpen('out')">📷 Skaner</button></h2><p class="mut noprint">Yorliqni noutbukka yopishtiring. Chiqarishda va qabul qilishda shu bitta QR skaner qilinadi: skaner oynasida “Chiqarish” yoki “Qabul qilish” rejimi tanlanadi. Havola: ${b}</p><div class="rg">${R.map(x=>`<div class="card qrc"><div data-q="${b}#${x.id.replace(' ','-')}"></div><b>${x.id}</b><div class="mut">${esc(x.model||'')}</div></div>`).join('')}</div>`}
function setSM(m){scanMode=m;document.querySelectorAll('.sgm').forEach(b=>b.classList.toggle('on',b.dataset.m===m));const s=document.getElementById('sm');if(s&&scanOn)s.textContent=m==='out'?'📤 Chiqarish: noutbuk QR kodini tuting':'📥 Qabul qilish: noutbuk QR kodini tuting'}
function scanOpen(m){if(m)scanMode=m;dlg(`<h2>📷 QR skaner</h2><div class="seg"><button class="sgm ${scanMode==='out'?'on':''}" data-m="out" onclick="setSM('out')">📤 Chiqarish</button><button class="sgm ${scanMode==='in'?'on':''}" data-m="in" onclick="setSM('in')">📥 Qabul qilish</button></div><video id="vid" playsinline muted style="width:100%;border-radius:14px;background:#000;min-height:160px;margin-top:10px"></video><p class="auto" id="sm">Kamera ochilmoqda…</p><label>Yoki NP raqamini tanlang</label><select id="mn">${S.laptops.map(x=>`<option>${x.id}</option>`).join('')}</select><div class="acts"><button class="btn ghost" onclick="closeD()">Yopish</button><button class="btn" onclick="const v=mn.value;closeD();goNP(v)">Ochish</button></div>`);scanStart().then(()=>setSM(scanMode))}
function goNP(id){const x=S.laptops.find(l=>l.id===id);if(!x){toast('⚠ Noutbuk topilmadi');return}setTab('room');if(x.group!=='room'){x.group==='emp'||x.group==='t1'||x.group==='t2'?editS(id):editL(id);return}
 const o=open(id);if(scanMode==='out'&&o){toast('⚠ '+id+' allaqachon '+o.person+'da. “Qabul qilish” rejimini tanlang');return}if(scanMode==='in'&&!o){toast('⚠ '+id+' xonada turibdi, hech kimga berilmagan');return}roomAct(id)}
{const _r=room;room=function(){return _r().replace('<button class="btn sm keep" onclick="scanOpen()">📷 QR skaner</button>','<button class="btn sm keep" onclick="scanOpen(\'out\')">📤 Chiqarish</button> <button class="btn ok sm keep" onclick="scanOpen(\'in\')">📥 Qabul qilish</button>')}}
(async()=>{try{const r=await api('/api/state');if(r.ok)await startSync((await r.json()).user)}catch(e){}})();
</script>
